<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">ISKRA planning workflow</title><desc id="desc">Reference-design overview, not a screenshot of a production interface.</desc><rect width="1200" height="350" rx="20" fill="#0c1f2e"/><g font-family="Arial,Helvetica,sans-serif"><text x="44" y="69" fill="#f4f7fa" font-size="37" font-weight="700" letter-spacing="2">ISKRA</text><text x="46" y="112" fill="#afc1d0" font-size="22">Planning over your existing ERP / MES.</text><text x="46" y="145" fill="#6ea8ff" font-size="12" letter-spacing="2">REFERENCE DESIGN / IGOR TELELYUKHIN</text><rect x="44" y="182" width="350" height="130" rx="14" fill="#142d40" stroke="#315064"/><text x="66" y="213" fill="#6ea8ff" font-size="12" letter-spacing="2">01 / INGEST</text><text x="66" y="250" fill="#f4f7fa" font-size="23" font-weight="600">Orders and documents</text><text x="66" y="280" fill="#afc1d0" font-size="17">Routing candidates</text><rect x="418" y="182" width="350" height="130" rx="14" fill="#142d40" stroke="#315064"/><text x="440" y="213" fill="#6ea8ff" font-size="12" letter-spacing="2">02 / PLAN</text><text x="440" y="250" fill="#f4f7fa" font-size="23" font-weight="600">Load, buy list, cash</text><text x="440" y="280" fill="#afc1d0" font-size="17">One reviewable workflow</text><rect x="792" y="182" width="350" height="130" rx="14" fill="#142d40" stroke="#315064"/><text x="814" y="213" fill="#6ea8ff" font-size="12" letter-spacing="2">03 / APPROVE</text><text x="814" y="250" fill="#f4f7fa" font-size="23" font-weight="600">Human go/no-go</text><text x="814" y="280" fill="#afc1d0" font-size="17">Then write to ERP</text></g></svg>
